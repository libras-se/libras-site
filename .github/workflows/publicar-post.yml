# Publica no blog o post aprovado no Agent Control (agentes.libras.se).
#
# O servidor do Agent Control cria a branch agentes/blog-<slug> a partir da main, commita UM
# arquivo blog/_entrada/<slug>.json e abre um PR. Este workflow roda nessa branch: monta o post
# com tools/blog/novo_post.py (que valida o JSON, gera o post e a capa, roda os geradores do
# blog/CLAUDE.md §8 e apaga o JSON) e commita o resultado na mesma branch como
# "feat(blog): <título>". Com o run verde, o servidor faz o merge (squash) do PR.
# JSON inválido deixa o run vermelho, com o motivo no log e nas anotações do run.
#
# O servidor acompanha os runs pelo nome deste arquivo (publicar-post.yml): não renomeie.
# Formato do JSON e fluxo completo: blog/CLAUDE.md, seção "Publicação pelo Agent Control".
name: Publicar post do Agent Control

on:
  push:
    branches: ["agentes/**"]
    paths: ["blog/_entrada/**"]
  workflow_dispatch:

permissions:
  contents: write

# Um run por branch de cada vez: um push novo do servidor espera o anterior terminar.
concurrency:
  group: publicar-post-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publicar:
    # Imagem fixa: o ubuntu-latest passa para o Ubuntu 26 em outubro de 2026, e uma troca de
    # imagem não deve mudar a publicação sem ninguém ver.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Recusa a branch principal
        if: github.ref_name == 'main' || github.ref_name == github.event.repository.default_branch
        run: |
          echo "::error::Este workflow só publica em branches de PR (agentes/**), nunca na branch principal."
          exit 1

      # A ponta da branch, e não o commit do evento: se o servidor mandar outro push enquanto um
      # run espera na fila, o run seguinte enxerga o estado mais novo.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/blog/requirements-publicador.txt

      # Só o que o novo_post.py e os geradores que ele chama importam: markdown-it-py e Pillow.
      - name: Dependências
        run: python -m pip install --disable-pip-version-check -r tools/blog/requirements-publicador.txt

      - name: Monta o post
        id: post
        run: python tools/blog/novo_post.py

      - name: Commita na mesma branch
        if: steps.post.outputs.slugs != ''
        env:
          TITULO: ${{ steps.post.outputs.titulo }}
          SLUGS: ${{ steps.post.outputs.slugs }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nada mudou: o post já estava montado."
            exit 0
          fi
          git commit -q -m "feat(blog): ${TITULO}" -m "Montado por tools/blog/novo_post.py a partir de blog/_entrada/ (${SLUGS})."
          git push origin "HEAD:refs/heads/${BRANCH}"
          echo "Commit $(git rev-parse --short HEAD) enviado para ${BRANCH}."
