# Build do GitHub Pages (Jekyll). O site é HTML estático; este arquivo só tira do site publicado
# o que é ferramenta, rascunho ou documento interno. Sem ele, o GitHub Pages converte cada .md em
# página pública (ex.: /blog/CLAUDE.html, /tools/aprender/PESQUISA.html) e publica os geradores.
# No Jekyll, "*" também casa com "/", então "*.md" cobre os .md de todas as pastas.
exclude:
  - "*.md"
  - "*.code-workspace"
  - tools/
  - scripts/
  - og/
  - emails/
  - audit/
  - crm/
  - CLIENTES/
  - "cogna 2026"
  - sinal/sinais.json
  - blog/template-blog.php
  - blog/template-blog-home-v2.php
  - "blog/**/post antigo*"
  - "blog/**/texto antigo"
  - "politica/*.docx"
  - Dockerfile
  - nginx.conf
  - package.json
  - package-lock.json
  - skills-lock.json
  # padrões do Jekyll (a lista acima substitui a lista padrão)
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
