server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/html
        application/json
        application/javascript
        text/javascript
        text/xml
        application/xml
        application/rss+xml
        image/svg+xml
        font/otf
        font/ttf
        font/woff
        font/woff2;

    # Block hidden files and directories, while allowing /.well-known/ validations.
    location ~ /\.(?!well-known(?:/|$)) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block internal directories if they are copied into the served root by mistake.
    location ~* (^|/)(\.git|\.github|\.vscode|\.agents|\.claude|\.cursor|node_modules|src|tests|test|docs|scripts|backup|backups|tmp|temp|config)(/|$) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block internal root-level artifacts and generated/source helper files.
    location ~* ^/(Dockerfile|docker-compose(?:\.[^/]+)?\.ya?ml|nginx\.conf|package(?:-lock)?\.json|pnpm-lock\.yaml|yarn\.lock|skills-lock\.json|.*\.code-workspace|blog/old-libras-se-blog-export\.json)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # The root /og/ folder is a local generator; public OG images live under /assets/img/og/.
    location ~* ^/og(?:/|$) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(?:md|markdown|csv|py|mjs|log|bak|backup|old|orig|swp|sql)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Immutable static assets, 1 year cache
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|otf|webp|avif|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # robots.txt and sitemap.xml, 24 h cache
    location ~* \.(xml|txt)$ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # HTML and everything else, no cache + security headers
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
