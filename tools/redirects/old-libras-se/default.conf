# Redireciona o blog antigo do Wix (old.libras.se, antes www.libras.se) para libras.se.
# O mapa vem de redirects.map, gerado por tools/seo/redirects.py. Não edite o mapa à mão.
map_hash_bucket_size 256;
map_hash_max_size 8192;

map $uri $libras_destino {
    default "";
    include /etc/nginx/redirects.map;
}

server {
    listen 80 default_server;
    server_name old.libras.se;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\n";
    }

    location = /saude {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        if ($libras_destino != "") {
            return 301 $libras_destino;
        }
        rewrite ^/post/ https://libras.se/blog/ permanent;
        rewrite ^/blog(/.*)?$ https://libras.se/blog/ permanent;
        return 301 https://libras.se/;
    }
}
